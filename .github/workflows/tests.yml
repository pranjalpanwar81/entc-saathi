name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Server starts in demo mode
        run: |
          DEMO_MODE=1 PORT=3000 node server.js &
          sleep 1
          curl -sf http://localhost:3000/healthz
